<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gotchu, Ma'am ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page3">

        <div class="surprise-page">

            <!-- SONG -->
            <audio id="teacherSong" autoplay loop>
                <source src="tibok.mp3.mp3" type="audio/mpeg">
            </audio>


            <!-- PHOTO -->
            <div class="third-photo">

                <img src="group-photo.jpg" alt="Our class group photo">

            </div>


            <!-- LYRIC -->
            <div class="lyric-card">

                <div class="small-label">
                    A LITTLE SOMETHING ♡
                </div>

                <p>
                    "Ubi cor, ibi domus"
                </p>

            </div>


            <!-- MESSAGE -->
            <div class="gotchu-card">

                <h1>GOTCHU, MA'AM ♡</h1>

                <p>
                    HAHAAHAHAHAAHAHAHAHAAHAHAHAAHA kami ang home, uli nas einstein ma'aaammmmmm
                </p>

            </div>


            <!-- PLAY / PAUSE BUTTON -->
            <button class="play-button" onclick="toggleSong()">
                ♫ PLAY SONG
            </button>


            <!-- ACTUAL HOME BUTTON -->
            <a href="index.html" class="real-home-button">
                first page
            </a>

        </div>

    </main>


    <script>

        const song = document.getElementById("teacherSong");
        const playButton = document.querySelector(".play-button");


        function toggleSong() {

            if (song.paused) {

                song.play();

                playButton.textContent = "⏸ PAUSE SONG";

            } else {

                song.pause();

                playButton.textContent = "♫ PLAY SONG";

            }

        }


        // Try to autoplay when the page opens
        window.addEventListener("load", function () {

            song.play().then(function () {

                playButton.textContent = "⏸ PAUSE SONG";

            }).catch(function () {

                console.log("Autoplay was blocked. Press PLAY SONG.");

            });

        });

    </script>

</body>

</html>
